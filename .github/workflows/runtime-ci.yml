name: CF-04 Runtime CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Quality gate
        run: bash tools/quality-check.sh
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: cf-04-sabri-central-media-1.1.0-rc.2
          path: dist/
