name: CF-04 Runtime CI

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-parity-publish:
    name: apply current rewritten-plan parity
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/cf04-three-plan-complete-1.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect one-time transformer
        id: parity
        shell: bash
        run: |
          if [[ -f tools/apply-current-plan-parity.py ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up PHP
        if: steps.parity.outputs.apply == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, fileinfo
          coverage: none
      - name: Install deterministic build tools
        if: steps.parity.outputs.apply == 'true'
        run: sudo apt-get update && sudo apt-get install -y zip unzip rsync
      - name: Apply transformer corrections
        if: steps.parity.outputs.apply == 'true'
        run: |
          if [[ -f tools/fix-current-plan-transformer.py ]]; then
            python3 tools/fix-current-plan-transformer.py
          fi
      - name: Apply current rewritten-plan source parity
        id: apply
        if: steps.parity.outputs.apply == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 tools/apply-current-plan-parity.py 2>&1 | tee parity-diagnostic.log
      - name: Upload transformer diagnostic
        if: steps.parity.outputs.apply == 'true' && steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cf04-current-plan-transformer-diagnostic-${{ github.sha }}
          path: parity-diagnostic.log
          if-no-files-found: error
          retention-days: 7
      - name: Stop after transformer failure
        if: steps.parity.outputs.apply == 'true' && steps.apply.outcome == 'failure'
        run: exit 1
      - name: Complete review gate then correct-by-failure
        id: review
        continue-on-error: true
        if: steps.parity.outputs.apply == 'true' && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          { git diff --check && bash tools/quality-check.sh; } 2>&1 | tee parity-review.log
      - name: Upload transformed-source review diagnostic
        if: steps.parity.outputs.apply == 'true' && steps.apply.outcome == 'success' && steps.review.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cf04-current-plan-review-diagnostic-${{ github.sha }}
          path: parity-review.log
          if-no-files-found: error
          retention-days: 7
      - name: Stop after review failure
        if: steps.parity.outputs.apply == 'true' && steps.apply.outcome == 'success' && steps.review.outcome == 'failure'
        run: exit 1
      - name: Fresh adversarial plan gate
        if: steps.parity.outputs.apply == 'true' && steps.apply.outcome == 'success' && steps.review.outcome == 'success'
        run: |
          set -euo pipefail
          php tests/new-plan-parity.php
          grep -q "public const PRIVACY=\['C0','C1','C2','C3','C4','C5'\]" sabri-central-media/includes/class-scm-contracts.php
          grep -q 'CF04-CEN-10' docs/runtime/REQUIREMENTS-COMPLETION-MATRIX.md
          grep -q 'CF04-NJ-06' docs/runtime/REQUIREMENTS-COMPLETION-MATRIX.md
          grep -q 'class-scm-plan-parity.php' sabri-central-media/sabri-central-media.php
          grep -q '1.3.0-rc.1' sabri-central-media/sabri-central-media.php
          grep -q "SCM_SCHEMA_VERSION','1.5.0" sabri-central-media/sabri-central-media.php
          grep -q "SCM_CONTRACT_VERSION','1.5.0" sabri-central-media/sabri-central-media.php
      - name: Final full regression
        if: steps.parity.outputs.apply == 'true' && steps.apply.outcome == 'success' && steps.review.outcome == 'success'
        run: bash tools/quality-check.sh
      - name: Remove one-time transport tooling and publish reviewed source
        id: publish
        continue-on-error: true
        if: steps.parity.outputs.apply == 'true' && steps.apply.outcome == 'success' && steps.review.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            rm -f tools/apply-current-plan-parity.py tools/fix-current-plan-transformer.py .github/workflows/apply-current-plan-parity.yml parity-diagnostic.log parity-review.log
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git status --short
            git commit -m 'CF-04: complete current rewritten-plan source parity 1.3.0-rc.1'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          } 2>&1 | tee parity-publish.log
      - name: Upload publication diagnostic
        if: steps.parity.outputs.apply == 'true' && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cf04-current-plan-publish-diagnostic-${{ github.sha }}
          path: parity-publish.log
          if-no-files-found: error
          retention-days: 7
      - name: Stop after publication failure
        if: steps.parity.outputs.apply == 'true' && steps.publish.outcome == 'failure'
        run: exit 1

  quality:
    name: quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, fileinfo
          coverage: none
      - name: Install OS tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip rsync
      - name: Quality, security and deterministic package gate
        run: bash tools/quality-check.sh
      - name: Publish release evidence summary
        run: |
          cat dist/RELEASE-EVIDENCE.json
          if [[ -f dist/cf-04-sabri-central-media-1.3.0-rc.1.zip ]]; then
            sha256sum dist/cf-04-sabri-central-media-1.3.0-rc.1.zip
          else
            sha256sum dist/cf-04-sabri-central-media-1.2.0-rc.2.zip
          fi
      - name: Upload deterministic release evidence
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: cf-04-sabri-central-media-${{ github.sha }}
          path: |
            dist/*.zip
            dist/MANIFEST.json
            dist/SBOM.json
            dist/CHECKSUMS.sha256
            dist/RELEASE-EVIDENCE.json
          if-no-files-found: error
          retention-days: 30
