name: CF-04 Runtime CI

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, fileinfo
          coverage: none
      - name: Install OS tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip rsync
      - name: Quality, security and deterministic package gate
        run: bash tools/quality-check.sh
      - name: Publish release evidence summary
        run: |
          cat dist/RELEASE-EVIDENCE.json
          sha256sum dist/cf-04-sabri-central-media-1.2.0-rc.2.zip
      - name: Upload deterministic release evidence
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: cf-04-sabri-central-media-1.2.0-rc.2-${{ github.sha }}
          path: |
            dist/cf-04-sabri-central-media-1.2.0-rc.2.zip
            dist/MANIFEST.json
            dist/SBOM.json
            dist/CHECKSUMS.sha256
            dist/RELEASE-EVIDENCE.json
          if-no-files-found: error
          retention-days: 30
