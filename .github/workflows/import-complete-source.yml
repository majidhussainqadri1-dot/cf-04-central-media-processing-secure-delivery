name: CF-04 Publish Three-Plan Complete Source

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
    paths:
      - .cf04-complete-import/part-00
      - .cf04-complete-import/part-01
      - .cf04-complete-import/part-02
      - .cf04-complete-import/part-03
      - .github/workflows/import-complete-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected implementation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify complete source archive
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03; do
            test -s ".cf04-complete-import/part-${part}"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = [
              'f666d25cd39baffec906a45860edfef6d934dde805a14f3b6ceaa34376d3010e',
              '5cf03c84f36805155ae9fa344960dfcc6e195bbc9c43af132d342d82b0ebf546',
              '64e3670b95210333e6017f910ae9da5ef70cb3c8fc3841e39277ed3118d2ce9b',
              '9831ddb4105ac1e9e5564ee7ba60a22bb4e4cd23194028e9131bf3437a074100',
              'bf7cb2af7ac3b2ef50a9c87335c3606662e5ff52653805594d3b44fa8a1978b2',
              'd341b6f27adf405075a1050c357bfad994197266807d8082dc51d1c21f9a0c1e',
              '2be9b8cb9bd13da95b3d50b53641b0a2a60a0b37b71cd13c0ed1682d59fa384c',
              '10eacbce835f150c1ab299c4590ca38767e8305ca06a8fe155a277b4cd8f59e4',
              'e2c929acb951a799717eecda2e78fb6aa25ee8f4e67909380450344075d05c70',
              '5d2803e27e87c4203b76087bad76574796465b68f9b62045ac5f0418439e0562',
              '0f0a23338a1a66f5081d01aa57be07d7d088de91250f7d8dab0b52792e4e4922',
              '447f4e0d7acfe9f96df6bd29a2837911d1bb31b8782126817e3ea25e38f088dc',
              '82750ce1366be85e40b8a6cea4ee46ca8135bea6914274fe8d1403d49b447cc9',
              '59b2c6b8d3a93be7be050357c2380b01599b1c4b5a77eb3554334ccb81a09970',
              '7b21d1f7843fe6149f46c8581cbce33ea274edd969194dc2b64ca7b1c21624bb',
              'aa19ccf2f94a46b12d79a30afd7437b112ea08753b07c538acfcfc49dbf38910',
              '7aa56851c313f38b5dedf0c90f94b5cc28e3c1123f9cee912521db9f1fac9ffe',
              '88cca3688e6f167ac92ced1b42fde70eeff86691e1028a91d95a8f3135e1006d',
              'ac32d059d717dc83bdbfcfd1c74b85160f98fb68d8a179005d537c016dfdf5d6',
          ]
          data = Path('.cf04-complete-import/part-02').read_bytes()
          mismatches = []
          for index, wanted in enumerate(expected):
              block = data[index * 1000:(index + 1) * 1000]
              actual = hashlib.sha256(block).hexdigest()
              if actual != wanted:
                  mismatches.append((index, actual, wanted))
          if mismatches:
              print('PART-02 BLOCK MISMATCHES:')
              for item in mismatches:
                  print(*item)
          else:
              print('PART-02 BLOCK HASHES: PASS')
          PY

          cat \
            .cf04-complete-import/part-00 \
            .cf04-complete-import/part-01 \
            .cf04-complete-import/part-02 \
            .cf04-complete-import/part-03 \
            > /tmp/cf04-complete.tar.xz.b64
          base64 --decode /tmp/cf04-complete.tar.xz.b64 > /tmp/cf04-complete.tar.xz

          expected='63a19fd4ac9679fa50b0a8b946d8609044b634924db1e5c4b8d2f3fda98134c0'
          actual="$(sha256sum /tmp/cf04-complete.tar.xz | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "::error title=CF-04 complete-source checksum mismatch::Expected ${expected}; reconstructed ${actual}"
            exit 1
          }
          xz --test /tmp/cf04-complete.tar.xz

      - name: Extract and execute full quality gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cf04-complete-source
          mkdir -p /tmp/cf04-complete-source
          tar -xJf /tmp/cf04-complete.tar.xz -C /tmp/cf04-complete-source
          test -f /tmp/cf04-complete-source/sabri-central-media/sabri-central-media.php
          test -f /tmp/cf04-complete-source/docs/runtime/REQUIREMENTS-COMPLETION-MATRIX.md
          test -x /tmp/cf04-complete-source/tools/quality-check.sh
          (
            cd /tmp/cf04-complete-source
            bash tools/quality-check.sh
          )

      - name: Publish clean source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cf04-complete-source/dist
          mkdir -p /tmp/cf04-complete-source/dist
          : > /tmp/cf04-complete-source/dist/.gitkeep

          rsync -a --delete \
            --exclude='.git/' \
            /tmp/cf04-complete-source/ ./

          rm -rf \
            .cf04-complete-import \
            .cf04-import-xz \
            .cf04-import \
            .bootstrap \
            .cf04-final-import \
            .cf04-three-plan-patch
          rm -f \
            .github/workflows/import-complete-source.yml \
            .github/workflows/import-rc5-source.yml \
            .github/workflows/import-three-plan-runtime.yml \
            .github/workflows/import-runtime.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'CF-04: publish three-plan source-complete 1.2.0-rc.1 candidate'
          git push origin "HEAD:${GITHUB_REF_NAME}"
