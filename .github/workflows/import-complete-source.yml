name: CF-04 Publish Three-Plan Complete Source

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
    paths:
      - .cf04-complete-import/part-00
      - .cf04-complete-import/part-01
      - .cf04-complete-import/part-02
      - .cf04-complete-import/part-02-block-17
      - .cf04-complete-import/part-03
      - .github/workflows/import-complete-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected implementation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify complete source archive
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03; do
            test -s ".cf04-complete-import/part-${part}"
          done
          test -s .cf04-complete-import/part-02-block-17

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          source = Path('.cf04-complete-import/part-02').read_bytes()
          correction = Path('.cf04-complete-import/part-02-block-17').read_bytes()
          if len(source) != 19000 or len(correction) != 1000:
              raise SystemExit('invalid source transport correction length')
          wanted = '88cca3688e6f167ac92ced1b42fde70eeff86691e1028a91d95a8f3135e1006d'
          actual = hashlib.sha256(correction).hexdigest()
          if actual != wanted:
              raise SystemExit(f'correction block checksum mismatch: {actual}')
          corrected = source[:17000] + correction + source[18000:]
          wanted_full = '03c03d45cf6848a38449c3a96cda22ecea6fcfb8d8f6825ec5513c8ac50a1796'
          actual_full = hashlib.sha256(corrected).hexdigest()
          if actual_full != wanted_full:
              raise SystemExit(f'corrected part-02 checksum mismatch: {actual_full}')
          Path('/tmp/cf04-part-02.corrected').write_bytes(corrected)
          print('part-02 transport correction: PASS')
          PY

          cat \
            .cf04-complete-import/part-00 \
            .cf04-complete-import/part-01 \
            /tmp/cf04-part-02.corrected \
            .cf04-complete-import/part-03 \
            > /tmp/cf04-complete.tar.xz.b64
          base64 --decode /tmp/cf04-complete.tar.xz.b64 > /tmp/cf04-complete.tar.xz

          expected='63a19fd4ac9679fa50b0a8b946d8609044b634924db1e5c4b8d2f3fda98134c0'
          actual="$(sha256sum /tmp/cf04-complete.tar.xz | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "::error title=CF-04 complete-source checksum mismatch::Expected ${expected}; reconstructed ${actual}"
            exit 1
          }
          xz --test /tmp/cf04-complete.tar.xz

      - name: Extract, normalize, review fixes and execute full quality gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cf04-complete-source
          mkdir -p /tmp/cf04-complete-source
          tar -xJf /tmp/cf04-complete.tar.xz -C /tmp/cf04-complete-source
          test -f /tmp/cf04-complete-source/sabri-central-media/sabri-central-media.php
          test -f /tmp/cf04-complete-source/docs/runtime/REQUIREMENTS-COMPLETION-MATRIX.md
          test -x /tmp/cf04-complete-source/tools/quality-check.sh

          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/cf04-complete-source')
          path = root / 'sabri-central-media/includes/class-scm-upload.php'
          source = path.read_text()
          old = "$upload['progress_percent']=min(100,round("
          new = "$upload['progress_percent']=(float)min(100.0,round("
          if source.count(old) != 1:
              raise SystemExit('expected upload progress expression not found exactly once')
          path.write_text(source.replace(old, new, 1))

          text_suffixes = {'.php', '.py', '.sh', '.md', '.txt', '.json', '.yml', '.yaml'}
          for item in root.rglob('*'):
              if not item.is_file():
                  continue
              if item.suffix.lower() not in text_suffixes and item.name not in {'.gitignore', '.gitattributes'}:
                  continue
              data = item.read_text()
              lines = [line.rstrip(' \t') for line in data.splitlines()]
              while lines and lines[-1] == '':
                  lines.pop()
              item.write_text('\n'.join(lines) + '\n')
          print('cross-version progress invariant and repository whitespace normalization: APPLIED')
          PY

          (
            cd /tmp/cf04-complete-source
            bash tools/quality-check.sh
          )

      - name: Publish clean source tree without mutating workflow files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cf04-complete-source/dist
          mkdir -p /tmp/cf04-complete-source/dist
          : > /tmp/cf04-complete-source/dist/.gitkeep

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/cf04-complete-source/ ./

          rm -rf \
            .cf04-complete-import \
            .cf04-import-xz \
            .cf04-import \
            .bootstrap \
            .cf04-final-import \
            .cf04-three-plan-patch

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'CF-04: publish three-plan source-complete 1.2.0-rc.1 candidate'
          git push origin "HEAD:${GITHUB_REF_NAME}"
