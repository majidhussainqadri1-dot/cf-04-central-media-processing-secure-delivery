name: CF-04 Import Three-Plan Runtime

on:
  push:
    branches:
      - codex/cf04-three-plan-runtime-final
    paths:
      - .cf04-final-import/READY
      - .github/workflows/import-three-plan-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct verified complete source and commit clean tree
        shell: bash
        run: |
          set -euo pipefail

          cat .cf04-final-import/part-* > /tmp/cf04-runtime.tar.xz.b64
          base64 --decode --ignore-garbage /tmp/cf04-runtime.tar.xz.b64 > /tmp/cf04-runtime.tar.xz
          actual="$(sha256sum /tmp/cf04-runtime.tar.xz | awk '{print $1}')"
          expected="9d45f04d54ec81e4a31e6dfaa51d13f4cd86d023eb531f7d98a1b8827b1ba469"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=CF-04 final archive checksum::Expected ${expected} but reconstructed ${actual}; encoded-bytes=$(wc -c </tmp/cf04-runtime.tar.xz.b64), archive-bytes=$(wc -c </tmp/cf04-runtime.tar.xz)"
            exit 1
          fi

          xz --test /tmp/cf04-runtime.tar.xz
          mkdir -p /tmp/cf04-runtime
          tar -xJf /tmp/cf04-runtime.tar.xz -C /tmp/cf04-runtime
          test -f /tmp/cf04-runtime/README.md
          test -f /tmp/cf04-runtime/sabri-central-media/sabri-central-media.php
          test -f /tmp/cf04-runtime/tests/review-round-8-three-plan-adversarial.php

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.cf04-final-import/' \
            --exclude='.cf04-import-xz/' \
            --exclude='.cf04-import/' \
            --exclude='.bootstrap/' \
            --exclude='.cf04-three-plan-patch/' \
            /tmp/cf04-runtime/ ./

          rm -rf .cf04-final-import .cf04-import-xz .cf04-import .bootstrap .cf04-three-plan-patch
          rm -f .github/workflows/import-three-plan-runtime.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CF-04: complete three-plan runtime 1.1.0-rc.1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
