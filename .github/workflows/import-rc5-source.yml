name: CF-04 Import Complete RC5 Source

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
    paths:
      - .github/workflows/import-rc5-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source-import branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify complete source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' PARTS < <(find .cf04-import-xz -maxdepth 1 -type f -name 'part-*' -print0 | sort -z)
          test "${#PARTS[@]}" -ge 4
          cat "${PARTS[@]}" > /tmp/cf04-source.tar.xz.b64
          tr -d '\r\n\t ' < /tmp/cf04-source.tar.xz.b64 > /tmp/cf04-source.tar.xz.flat.b64
          base64 --decode --ignore-garbage /tmp/cf04-source.tar.xz.flat.b64 > /tmp/cf04-source.tar.xz || true

          expected='68bed9d09cc09b43af155dec6feb6801959dceb847cb2fa9630d4989a8f86399'
          actual="$(sha256sum /tmp/cf04-source.tar.xz | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=CF-04 source checksum mismatch::Expected $expected, got $actual"
            exit 1
          fi

          xz --test /tmp/cf04-source.tar.xz
          mkdir -p /tmp/cf04-extracted
          tar -xJf /tmp/cf04-source.tar.xz -C /tmp/cf04-extracted

          plugin="$(find /tmp/cf04-extracted -type f -path '*/sabri-central-media/sabri-central-media.php' -print -quit)"
          test -n "$plugin"
          source_root="$(dirname "$(dirname "$plugin")")"
          test -f "$source_root/tools/quality-check.sh"
          test -d "$source_root/tests"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.cf04-import-xz/' \
            --exclude='.cf04-import/' \
            "$source_root/" ./

          rm -rf .cf04-import-xz .cf04-import
          rm -f .github/workflows/import-rc5-source.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'CF-04: publish verified complete RC5 source baseline'
          git push origin "HEAD:${GITHUB_REF_NAME}"
