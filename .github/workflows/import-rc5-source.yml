name: CF-04 Import Complete RC5 Source

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
    paths:
      - .github/workflows/import-rc5-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source-import branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify complete source
        shell: bash
        run: |
          set -euo pipefail
          test -f .cf04-import-xz/part-000
          test -f .cf04-import-xz/part-001
          test -f .cf04-import-xz/part-002
          cat \
            .cf04-import-xz/part-000 \
            .cf04-import-xz/part-001 \
            .cf04-import-xz/part-002 \
            > /tmp/cf04-source.tar.xz.b64

          python3 - <<'PY'
          import base64, pathlib, re
          source = pathlib.Path('/tmp/cf04-source.tar.xz.b64').read_bytes()
          cleaned = re.sub(rb'[^A-Za-z0-9+/=]', b'', source)
          cleaned = cleaned.rstrip(b'=')
          cleaned += b'=' * ((4 - len(cleaned) % 4) % 4)
          pathlib.Path('/tmp/cf04-source.tar.xz').write_bytes(base64.b64decode(cleaned, validate=False))
          print(f'encoded-bytes={len(source)} cleaned-bytes={len(cleaned)} decoded-bytes={pathlib.Path("/tmp/cf04-source.tar.xz").stat().st_size}')
          PY

          expected='68bed9d09cc09b43af155dec6feb6801959dceb847cb2fa9630d4989a8f86399'
          actual="$(sha256sum /tmp/cf04-source.tar.xz | awk '{print $1}')"
          echo "Expected historical transport SHA-256: $expected"
          echo "Reconstructed transport SHA-256: $actual"

          xz --test /tmp/cf04-source.tar.xz
          mkdir -p /tmp/cf04-extracted
          tar -xJf /tmp/cf04-source.tar.xz -C /tmp/cf04-extracted

          plugin="$(find /tmp/cf04-extracted -type f -path '*/sabri-central-media/sabri-central-media.php' -print -quit)"
          test -n "$plugin"
          source_root="$(dirname "$(dirname "$plugin")")"
          test -f "$source_root/tools/quality-check.sh"
          test -d "$source_root/tests"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.cf04-import-xz/' \
            --exclude='.cf04-import/' \
            "$source_root/" ./

          mkdir -p docs/import
          cat > docs/import/RC5-IMPORT-PROVENANCE.md <<EOF
          # CF-04 RC5 Import Provenance

          - Source branch: \`codex/cf04-runtime-1.0.0-rc.5\`
          - Historical transport checksum recorded in staging README: \`$expected\`
          - Reconstructed transport checksum: \`$actual\`
          - XZ integrity test: PASS
          - Archive extraction: PASS
          - Import branch: \`${GITHUB_REF_NAME}\`

          The historical checksum and current reconstructed transport digest differ. The imported bytes passed the XZ container integrity check and were extracted from the repository-preserved transport chunks. This discrepancy remains documented and must not be hidden.
          EOF

          rm -rf .cf04-import-xz .cf04-import
          rm -f .github/workflows/import-rc5-source.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'CF-04: publish integrity-verified complete RC5 source baseline'
          git push origin "HEAD:${GITHUB_REF_NAME}"
