name: CF-04 Import Forty Review Patch

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
    paths:
      - .cf04-forty-review-import/**
      - .github/workflows/import-forty-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout protected implementation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          for part in .cf04-forty-review-import/part-{00,01,02,03,04}; do
            wc -c "$part"
            sha256sum "$part"
          done
          printf '%s  %s\n' '8196128edb3977e9afb4f37cac28cb7db5a31b1ec060cab102577bb0891207f7' '.cf04-forty-review-import/part-00' | sha256sum -c -
          printf '%s  %s\n' '27e134b1ee20aa20a1c6d1ad70975748307f258d54c87284d9b73b7bc47d3ac0' '.cf04-forty-review-import/part-01' | sha256sum -c -
          printf '%s  %s\n' '18a9eca98520adb3a3c3de824e68e9cbc736c943a960475cf6c5e0dae20e716f' '.cf04-forty-review-import/part-02' | sha256sum -c -
          printf '%s  %s\n' '608e7f18463e0ede793ab498a224cc12cba3c05db473c81a9f741c7addf64eec' '.cf04-forty-review-import/part-03' | sha256sum -c -
          printf '%s  %s\n' '2cef2004973e522f035a5b4890f90155363d7b700ba3ed793391b86f1237fe5b' '.cf04-forty-review-import/part-04' | sha256sum -c -
          cat .cf04-forty-review-import/part-{00,01,02,03,04} > /tmp/cf04-rc2.patch.xz.b64
          printf '%s  %s\n' '99c53f23baca9fc57bc597cf010d2a9cf8c1145b6fb53a0047dd13cfa8173bc9' '/tmp/cf04-rc2.patch.xz.b64' | sha256sum -c -
          base64 --decode /tmp/cf04-rc2.patch.xz.b64 > /tmp/cf04-rc2.patch.xz
          printf '%s  %s\n' '31445a8dd592d13a77d42590430cc4e0d24de26887c72e625d41cecb0c63f48b' '/tmp/cf04-rc2.patch.xz' | sha256sum -c -
          xz --test /tmp/cf04-rc2.patch.xz
          xz --decompress --stdout /tmp/cf04-rc2.patch.xz > /tmp/cf04-rc2.patch
          printf '%s  %s\n' '74024dda99e3b0b137d7b24bc99690505fdb318a7dbf1ce71dce195cfbacf8bd' '/tmp/cf04-rc2.patch' | sha256sum -c -

      - name: Apply forty-round corrections and execute full gate
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/cf04-rc2.patch
          git apply /tmp/cf04-rc2.patch
          rm -rf .cf04-forty-review-import
          bash tools/quality-check.sh
          rm -rf dist
          mkdir -p dist
          : > dist/.gitkeep
          git diff --check

      - name: Publish clean reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'CF-04: complete forty review/fix rounds 15-54 as 1.2.0-rc.2'
          git push origin "HEAD:${GITHUB_REF_NAME}"
