name: CF-04 Export Review Source

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
    paths:
      - .github/workflows/export-review-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v5
      - name: Build review source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          with zipfile.ZipFile('/tmp/cf04-review-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts):
                  archive.write(path,path.as_posix())
          PY
      - name: Upload exact review source
        uses: actions/upload-artifact@v4
        with:
          name: cf04-review-source-${{ github.sha }}
          path: /tmp/cf04-review-source.zip
          if-no-files-found: error
          retention-days: 1
