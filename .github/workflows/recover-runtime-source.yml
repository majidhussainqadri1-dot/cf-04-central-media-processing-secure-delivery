name: CF-04 Recover Runtime Source

on:
  push:
    branches:
      - codex/cf04-three-plan-runtime-final
    paths:
      - .github/workflows/recover-runtime-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decode and recover every committed payload
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/cf04-recovery

          decode_set() {
            local label="$1"; shift
            local combined="/tmp/cf04-recovery/${label}.b64"
            local flat="/tmp/cf04-recovery/${label}.flat.b64"
            local decoded="/tmp/cf04-recovery/${label}.bin"
            : > "$combined"
            for pattern in "$@"; do
              for file in $pattern; do
                [[ -f "$file" ]] && cat "$file" >> "$combined"
              done
            done
            tr -d '\r\n\t ' < "$combined" > "$flat"
            local len rem
            len=$(wc -c < "$flat")
            rem=$((len % 4))
            [[ $rem -eq 2 ]] && printf '==' >> "$flat"
            [[ $rem -eq 3 ]] && printf '=' >> "$flat"
            base64 --decode --ignore-garbage "$flat" > "$decoded" 2>"/tmp/cf04-recovery/${label}.base64.err" || true
            echo "${label}: encoded=${len}; decoded=$(wc -c < "$decoded"); sha256=$(sha256sum "$decoded" | awk '{print $1}')" | tee -a /tmp/cf04-recovery/payload-summary.txt
            file "$decoded" | tee -a /tmp/cf04-recovery/payload-summary.txt || true
          }

          decode_set import_xz '.cf04-import-xz/part-000' '.cf04-import-xz/part-001' '.cf04-import-xz/part-002'
          decode_set final_import '.cf04-final-import/part-*'
          decode_set old_import '.cf04-import/part-*'
          decode_set three_plan_patch '.cf04-three-plan-patch/part-*'

          recover_xz() {
            local label="$1"
            local input="/tmp/cf04-recovery/${label}.bin"
            local partial="/tmp/cf04-recovery/${label}.partial.tar"
            local out="/tmp/cf04-recovery/${label}-out"
            mkdir -p "$out"
            xz -dc "$input" > "$partial" 2>"/tmp/cf04-recovery/${label}.xz.err" || true
            tar -tf "$partial" > "/tmp/cf04-recovery/${label}.tar-list.txt" 2>"/tmp/cf04-recovery/${label}.tar.err" || true
            tar -xf "$partial" -C "$out" --ignore-zeros 2>>"/tmp/cf04-recovery/${label}.tar.err" || true
            echo "${label}: partial-tar=$(wc -c < "$partial"); recovered-files=$(find "$out" -type f | wc -l)" | tee -a /tmp/cf04-recovery/payload-summary.txt
          }

          recover_xz import_xz
          recover_xz final_import

          mkdir -p /tmp/cf04-recovery/old_import-out
          unzip -o /tmp/cf04-recovery/old_import.bin -d /tmp/cf04-recovery/old_import-out > /tmp/cf04-recovery/old_import.unzip.log 2>&1 || true
          yes | zip -FF /tmp/cf04-recovery/old_import.bin --out /tmp/cf04-recovery/old_import-fixed.zip > /tmp/cf04-recovery/old_import.fix.log 2>&1 || true
          if [[ -s /tmp/cf04-recovery/old_import-fixed.zip ]]; then
            unzip -o /tmp/cf04-recovery/old_import-fixed.zip -d /tmp/cf04-recovery/old_import-out >> /tmp/cf04-recovery/old_import.unzip.log 2>&1 || true
          fi
          echo "old_import: recovered-files=$(find /tmp/cf04-recovery/old_import-out -type f | wc -l)" | tee -a /tmp/cf04-recovery/payload-summary.txt

          gzip -dc /tmp/cf04-recovery/three_plan_patch.bin > /tmp/cf04-recovery/three-plan.patch 2>/tmp/cf04-recovery/three-plan.gzip.err || true
          grep '^diff --git ' /tmp/cf04-recovery/three-plan.patch > /tmp/cf04-recovery/three-plan-paths.txt || true
          echo "three_plan_patch: bytes=$(wc -c < /tmp/cf04-recovery/three-plan.patch); paths=$(wc -l < /tmp/cf04-recovery/three-plan-paths.txt)" | tee -a /tmp/cf04-recovery/payload-summary.txt
          cat /tmp/cf04-recovery/payload-summary.txt

      - name: Build union candidates and apply the complete three-plan patch
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/cf04-recovery/candidates
          : > /tmp/cf04-recovery/candidate-results.txt

          old_root='/tmp/cf04-recovery/old_import-out/CF-04-GitHub-Source-1.0.0-rc.5'
          import_root='/tmp/cf04-recovery/import_xz-out'
          final_root='/tmp/cf04-recovery/final_import-out'

          make_candidate() {
            local label="$1"; shift
            local candidate="/tmp/cf04-recovery/candidates/${label}"
            rm -rf "$candidate"
            mkdir -p "$candidate"
            for root in "$@"; do
              [[ -d "$root" ]] && rsync -a "$root/" "$candidate/"
            done

            echo "===== ${label} =====" | tee -a /tmp/cf04-recovery/candidate-results.txt
            echo "before-files=$(find "$candidate" -type f | wc -l)" | tee -a /tmp/cf04-recovery/candidate-results.txt

            if [[ -s /tmp/cf04-recovery/three-plan.patch ]]; then
              (cd "$candidate" && git init -q && git add -A && git -c user.name=CF04 -c user.email=cf04@example.invalid commit -qm baseline || true)
              (cd "$candidate" && git apply --reject --whitespace=nowarn /tmp/cf04-recovery/three-plan.patch) \
                >> /tmp/cf04-recovery/candidate-results.txt 2>&1 || true
              (cd "$candidate" && patch -p1 --batch --forward < /tmp/cf04-recovery/three-plan.patch) \
                >> /tmp/cf04-recovery/candidate-results.txt 2>&1 || true
            fi

            echo "after-files=$(find "$candidate" -type f | wc -l)" | tee -a /tmp/cf04-recovery/candidate-results.txt
            echo "rejects=$(find "$candidate" -name '*.rej' -type f | wc -l)" | tee -a /tmp/cf04-recovery/candidate-results.txt
            [[ -f "$candidate/sabri-central-media/sabri-central-media.php" ]] && echo 'bootstrap=yes' | tee -a /tmp/cf04-recovery/candidate-results.txt
            [[ -f "$candidate/tools/quality-check.sh" ]] && echo 'quality-script=yes' | tee -a /tmp/cf04-recovery/candidate-results.txt

            if [[ -f "$candidate/sabri-central-media/sabri-central-media.php" && -f "$candidate/tools/quality-check.sh" ]]; then
              set +e
              (cd "$candidate" && bash tools/quality-check.sh) > "/tmp/cf04-recovery/${label}.qa.log" 2>&1
              local qa=$?
              set -e
              echo "qa-exit=${qa}" | tee -a /tmp/cf04-recovery/candidate-results.txt
              if [[ $qa -eq 0 ]]; then
                echo "$candidate" > /tmp/cf04-recovery/selected-candidate.txt
                echo "$label" > /tmp/cf04-recovery/selected-label.txt
                return 0
              fi
            fi
            return 1
          }

          make_candidate import-only "$import_root" || true
          [[ -f /tmp/cf04-recovery/selected-candidate.txt ]] || make_candidate old-only "$old_root" || true
          [[ -f /tmp/cf04-recovery/selected-candidate.txt ]] || make_candidate final-only "$final_root" || true
          [[ -f /tmp/cf04-recovery/selected-candidate.txt ]] || make_candidate union-old-final-import "$old_root" "$final_root" "$import_root" || true
          [[ -f /tmp/cf04-recovery/selected-candidate.txt ]] || make_candidate union-final-old-import "$final_root" "$old_root" "$import_root" || true
          [[ -f /tmp/cf04-recovery/selected-candidate.txt ]] || make_candidate union-import-old-final "$import_root" "$old_root" "$final_root" || true

          cat /tmp/cf04-recovery/candidate-results.txt
          find /tmp/cf04-recovery/candidates -name '*.rej' -type f -print | sort > /tmp/cf04-recovery/reject-paths.txt
          cat /tmp/cf04-recovery/reject-paths.txt

      - name: Publish only a fully recovered and QA-green source tree
        shell: bash
        run: |
          set -euo pipefail
          [[ -f /tmp/cf04-recovery/selected-candidate.txt ]] || exit 0
          selected="$(cat /tmp/cf04-recovery/selected-candidate.txt)"
          test -f "$selected/sabri-central-media/sabri-central-media.php"
          test -f "$selected/tools/quality-check.sh"
          (cd "$selected" && bash tools/quality-check.sh)
          rsync -a --delete --exclude='.git/' "$selected/" ./
          rm -rf .cf04-final-import .cf04-import-xz .cf04-import .bootstrap .cf04-three-plan-patch
          rm -f .github/workflows/import-three-plan-runtime.yml .github/workflows/recover-runtime-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'CF-04: recover and publish verified runtime source'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload forensic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf04-runtime-recovery-evidence
          path: |
            /tmp/cf04-recovery/*.txt
            /tmp/cf04-recovery/*.log
            /tmp/cf04-recovery/*.err
            /tmp/cf04-recovery/three-plan.patch
            /tmp/cf04-recovery/*.qa.log
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed when no QA-green candidate exists
        if: always()
        shell: bash
        run: |
          if [[ ! -f /tmp/cf04-recovery/selected-candidate.txt ]]; then
            echo 'No complete, patchable and QA-green runtime source was recoverable from committed payloads.'
            exit 1
          fi
