name: CF-04 Apply Current Plan Parity

on:
  push:
    branches:
      - codex/cf04-three-plan-complete-1.2.0
    paths:
      - tools/apply-current-plan-parity.py
      - .github/workflows/apply-current-plan-parity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf04-current-plan-parity
  cancel-in-progress: false

jobs:
  apply-review-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, fileinfo
          coverage: none

      - name: Install deterministic build tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip rsync

      - name: Apply current rewritten-plan parity transformation
        run: python3 tools/apply-current-plan-parity.py

      - name: First complete review gate — syntax, contracts, implementation and plan traceability
        run: |
          set -euo pipefail
          git diff --check
          bash tools/quality-check.sh

      - name: Fresh adversarial review gate — new-plan invariants
        run: |
          set -euo pipefail
          php tests/new-plan-parity.php
          grep -q "public const PRIVACY=\['C0','C1','C2','C3','C4','C5'\]" sabri-central-media/includes/class-scm-contracts.php
          grep -q "CF04-CEN-10" docs/runtime/REQUIREMENTS-COMPLETION-MATRIX.md
          grep -q "CF04-NJ-06" docs/runtime/REQUIREMENTS-COMPLETION-MATRIX.md
          grep -q "class-scm-plan-parity.php" sabri-central-media/sabri-central-media.php
          grep -q "1.3.0-rc.1" sabri-central-media/sabri-central-media.php
          grep -q "SCM_SCHEMA_VERSION','1.5.0" sabri-central-media/sabri-central-media.php
          grep -q "SCM_CONTRACT_VERSION','1.5.0" sabri-central-media/sabri-central-media.php

      - name: Final full regression and deterministic package parity
        run: bash tools/quality-check.sh

      - name: Remove one-time transport tooling
        run: rm -f tools/apply-current-plan-parity.py .github/workflows/apply-current-plan-parity.yml

      - name: Publish clean reviewed source
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'CF-04: complete current rewritten-plan source parity 1.3.0-rc.1'
          git push origin "HEAD:${GITHUB_REF_NAME}"
