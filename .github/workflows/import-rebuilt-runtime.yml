name: CF-04 Import Rebuilt Runtime

on:
  push:
    branches:
      - codex/cf04-three-plan-runtime-final
    paths:
      - .cf04-new-import/**
      - .github/workflows/import-rebuilt-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify and publish rebuilt source
        shell: bash
        run: |
          set -euo pipefail

          cat .cf04-new-import/part-000 .cf04-new-import/part-001 > /tmp/cf04.b64
          base64 --decode /tmp/cf04.b64 > /tmp/cf04-source.tar.xz
          echo "0b01031050514a85dbd3dece3c4b8434fdf6e77ac4ff9e01b9a130c8aa2fc017  /tmp/cf04-source.tar.xz" | sha256sum -c -
          xz --test /tmp/cf04-source.tar.xz

          mkdir -p /tmp/cf04-source
          tar -xJf /tmp/cf04-source.tar.xz -C /tmp/cf04-source

          test -f /tmp/cf04-source/sabri-central-media/sabri-central-media.php
          test -f /tmp/cf04-source/sabri-central-media/includes/class-scm-upload-service.php
          test -f /tmp/cf04-source/sabri-central-media/includes/class-scm-scanner-registry.php
          test -f /tmp/cf04-source/sabri-central-media/includes/class-scm-record-store.php
          test -f /tmp/cf04-source/tests/review-round-8-three-plan-adversarial.php
          test -f /tmp/cf04-source/tools/quality-check.sh

          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/cf04-source/ ./
          chmod +x tools/quality-check.sh
          bash tools/quality-check.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CF-04: publish rebuilt fail-closed runtime 1.1.0-rc.2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
